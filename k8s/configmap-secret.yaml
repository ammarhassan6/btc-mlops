apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-config
  labels:
    app: btc-api
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  DATA_DIR: "/app/models/data"
  MAPE_THRESHOLD: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-secret
  labels:
    app: btc-api
type: Opaque
stringData:
  API_KEY: "changeme-demo-key"
