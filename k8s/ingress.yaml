apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btc-api-ingress
  labels:
    app: btc-api
  annotations:
    # ARIMA refits under load can take longer than nginx's default 60s
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: btc-forecast.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: btc-api-service
                port:
                  number: 80
